ne(value: Text) -> Boolean {\n    let parts = text.split(value, \"-\")\n    if text.length(value) != 10 or collections.length(parts) != 3 { return false }\n    if text.length(parts[0]) != 4 or text.length(parts[1]) != 2 or text.length(parts[2]) != 2 { return false }\n    let year = decimal(parts[0])\n    let month = decimal(parts[1])\n    let day = decimal(parts[2])\n    if year \u003c 1900 or year > 2200 or month \u003c 1 or month > 12 or day \u003c 1 { return false }\n    let days = 31\n    if month == 4 or month == 6 or month == 9 or month == 11 { days = 30 }\n    if month == 2 {\n        days = 28\n        if year % 400 == 0 or (year % 4 == 0 and year % 100 != 0) { days = 29 }\n    }\n    return day \u003c= days\n}\nderive projectCount = collections.length(projects)\nderive pendingCount = pending(projects)\nderive completedCount = projectCount - pendingCount\nderive selectedStatus = taskStatus(selectedDone)\n\nscreen overview \"Moj radni pregled\" {\n    row {\n        row {\n            card \"TVOJ RITAM. TVOJ PROSTOR.\" {\n                heading \"Manje rasutih bilješki. Više jasnih koraka.\" style { fontSize 38; fontWeight 700; font \"serif\"; color \"#24342e\" } key intro_title\n                text \"Klijenti, projekti i ono što radiš sljedeće — na jednom mjestu.\" style { color \"#63726b\"; fontSize 16 } key intro_text\n            } style { background \"transparent\"; borderWidth 0; padding 0; maxWidth 640 } key intro\n            button \"+ Novi projekat\" runs begin_new style { background \"#315a49\"; color \"#ffffff\"; radius 12; padding 16; fontWeight 700; width 190 } key new_project\n        } style { align \"center\"; justify \"space-between\"; gap 32; wrap \"wrap\" } key hero\n        row {\n            card \"PROJEKTI\" { show projectCount style { fontSize 38; fontWeight 700; color \"#24342e\" } key projects_count } style { background \"#ffffff\"; borderColor \"#e3e8e1\"; radius 16; padding 22 } key metric_projects\n            card \"SLJEDEĆI KORACI\" { show pendingCount style { fontSize 38; fontWeight 700; color \"#9a5327\" } key pending_count } style { background \"#f7ede3\"; borderColor \"#eedfce\"; radius 16; padding 22 } key metric_pending\n            card \"ZAVRŠENI ZADACI\" { show completedCount style { fontSize 38; fontWeight 700; color \"#315a49\" } key completed_count } style { background \"#e8efe5\"; borderColor \"#dce5d8\"; radius 16; padding 22 } key metric_completed\n        } style { gap 16; wrap \"wrap\" \n direction \"row\"\n} key metrics\n        cards projects label \"Projekti s klijentima\" fields [name: \"Projekat\", client: \"Klijent\", deadline: \"Rok\", nextTask: \"Sljedeći korak\"] identity id select selected action \"Otvori projekat\" runs open_project empty \"Prvi projekat počinje jednim jasnim korakom. Dodaj ga dugmetom iznad.\" style { color \"#24342e\" } key project_cards\n    } style { background \"#f5f4ee\"; color \"#24342e\"; borderWidth 0; padding 32; radius 24; gap 30; direction \"column\" } key overview_surface\n}\n\nscreen editor \"Podaci projekta\" {\n    card \"SLOŽI SVOJ SLJEDEĆI KORAK\" {\n        heading \"Dovoljno detalja da znaš šta slijedi.\" style { font \"serif\"; fontSize 32; color \"#24342e\" } key editor_title\n        text \"Jedan projekat, jedan naredni zadatak. Sve kasnije možeš urediti.\" style { color \"#63726b\" } key editor_intro\n        row {\n            input draftName label \"Naziv projekta\" required style { width \"fill\" } key project_name\n            input draftClient label \"Klijent\" required style { width \"fill\" } key project_client\n        } style { gap 20; wrap \"wrap\" } key identity_fields\n        input draftDeadline label \"Rok · GGGG-MM-DD\" required key project_deadline\n        input draftTask label \"Sljedeći zadatak\" required multiline key project_task\n        row {\n            button \"Sačuvaj projekat\" runs save_project validate style { background \"#315a49\"; color \"#ffffff\"; radius 12; fontWeight 700; padding 14 aftClient) > 120 { raise \"Client\", \"Klijent treba1–120 znakova.\" }\n    if text.length(draftTask) \u003c 1 or text.length(draftTask) > 500 { raise \"Task\", \"Sljedeći zadatak treba1–500 znakova.\" }\n    if not validDeadline(draftDeadline) { raise \"Deadline\", \"Upiši stvarni datum roka u obliku GGGG-MM-DD, npr.2026-11-30.\" }\n    let done = false\n    if selected == \"\" {\n        if collections.length(projects) >= 200 { raise \"Capacity\", \"Ovaj lični prostor podržava do200 projekata.\" }\n        selected = text.concat(\"project_\", json.encode(nextId))\n        nextId = nextId + 1\n        projects = collections.append(projects, new Project { id: selected, name: draftName, client: draftClient, deadline: draftDeadline, nextTask: draftTask, done: false })\n    } else {\n        let index = findProject(projects, selected)\n        if index \u003c 0 { raise \"Selection\", \"Projekat više ne postoji.\" }\n        done = projects[index].done and projects[index].nextTask == draftTask\n        projects = collections.replace(projects, index, new Project { id: selected, name: draftName, client: draftClient, deadline: draftDeadline, nextTask: draftTask, done: done })\n    }\n    selectedName = draftName\n    selectedClient = draftClient\n    selectedDeadline = draftDeadline\n    selectedTask = draftTask\n    selectedDone = done\n    removalConfirmed = false\n    open detail\n}\non complete_task {\n    let index = findProject(projects, selected)\n    if index \u003c 0 { raise \"Selection\", \"Projekat više ne postoji.\" }\n    projects[index].done = true\n    selectedDone = true\n}\non reopen_task {\n    let index = findProject(projects, selected)\n    if index \u003c 0 { raise \"Selection\", \"Projekat više ne postoji.\" }\n    projects[index].done = false\n    selectedDone = false\n}\non remove_project {\n    if not removalConfirmed { raise \"Confirmation\", \"Prvo potvrdi da želiš ukloniti odabrani projekat.\" }\n    let index = findProject(projects, selected)\n function saveFile(name,bytes,type){const u=URL.createObjectURL(new Blob([bytes],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
const engine=new CLEA7Engine.Engine(app,{modules:null,diagnosticsMode:'production',notify:report,render:e=>{CLEA7Engine.mount(root,e);for(const output of root.querySelectorAll('[data-bil-view] output')){const card=output.closest('.bil-card'),label=card?.querySelector(':scope > h2')?.textContent;output.setAttribute('aria-label',label||'Vrijednost');}}});
engine.open().then(()=>{

 storage.textContent=engine.vault.persistent?'Lokalno čuvanje uključeno':'Trajno čuvanje nije dostupno';storage.dataset.state=engine.vault.persistent?'ready':'error';
 if(!engine.vault.persistent)report('Preglednik je odbio trajno čuvanje. Preuzmi kopiju podataka prije zatvaranja.');
 document.getElementById('data-backup').disabled=false;document.getElementById('data-restore').disabled=false;
}).catch(e=>{storage.textContent='Aplikacija nije pokrenuta';storage.dataset.state='error';report(e.message);});
document.getElementById('data-backup').onclick=async()=>{try{saveFile(app.id+'-podaci.json',JSON.stringify(await engine.backupFull(),null,2),'application/json');}catch(e){report(e.message);}};
const restore=document.getElementById('restore-file');document.getElementById('data-restore').onclick=()=>restore.click();
restore.onchange=async()=>{try{const f=restore.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('Kopija prelazi20 MiB.');if(!confirm('Zamijeniti podatke ove aplikacije odabranom kopijom?'))return;await engine.restoreFull(JSON.parse(await f.text()));report('Podaci su vraćeni iz kopije.');}catch(e){report(e.message);}finally{restore.value='';}};
addEventListener('beforeunload',e=>{if(engine.pending){e.preventDefault();e.returnValue='';}});addEventListener('pagehide',()=>engine.close());addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
</script></body></html>
