name: Verify standalone CLEA conversation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_public.py
      - run: node --check razgovor/boot.js
      - run: npm install --prefix /tmp/clea7-qa --no-audit --no-fund playwright@1.56.1
      - name: Actual standalone model, Worker, offline and mobile behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/clea7-standalone-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          export CLEA7_CHROME="$(command -v google-chrome)"
          node tests/test_standalone_chat_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BL-CLEA7-standalone-conversation-evidence
          path: test-evidence/standalone-chat/
          retention-days: 14
