name: Publish exact verified CLEA0.39 native artifacts
on:
  push:
    branches: [work/clea-qwen-unified-027]
    paths: [.github/workflows/publish-checked-039.yml]
  workflow_dispatch:
    inputs:
      target:
        description: Exact checked artifact family
        type: choice
        options: [android, windows]
        default: android
      transfer_url:
        description: Short-lived HTTPS transfer of the exact approved artifact
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'omer87h-ctrl/blclea7-site.' && github.actor == 'omer87h-ctrl'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: clea-checked-release-039-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          CLEA_APPROVED_TRANSFER_URL: ${{ inputs.transfer_url }}
        with:
          script: core.setSecret(process.env.CLEA_APPROVED_TRANSFER_URL);
      - name: Verify exact artifact hashes and native execution evidence before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEA_APPROVED_TRANSFER_URL: ${{ inputs.transfer_url }}
          CLEA_CHECKED_TARGET: ${{ inputs.target }}
          CLEA_CHECKED_VARIANT: integrated-039
        run: |
          if [ "$CLEA_CHECKED_TARGET" = android ]; then
            python -m scripts.publish_checked_android_039
          elif [ "$CLEA_CHECKED_TARGET" = windows ]; then
            python -m scripts.publish_checked_038
          else
            exit 1
          fi
