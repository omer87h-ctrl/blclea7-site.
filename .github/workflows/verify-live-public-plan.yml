name: Verify compact Qwen Studio authoring
on:
  push:
    branches: [fix/clea-live-plan-20261125]
    paths: [.github/workflows/verify-live-public-plan.yml, studio/workbench/public-plan.js, studio/workbench/ai-authoring.js, tests/test_live_public_plan.cjs]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            studio
            tests/test_live_public_plan.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify compact plan and actual public Qwen
        env:
          CLEA_REAL_MODEL_TEST: '1'
        run: node tests/test_live_public_plan.cjs
