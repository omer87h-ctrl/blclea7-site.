name: Verify local CLEA AI experiment
on:
  push:
    branches: [work/local-clea-ai-019]
permissions:
  contents: read
jobs:
  local-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLEA7_SOURCE_WEB: studio
      CLEA7_WEB_PATH: /studio
      CLEA7_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_caci.cjs
      - run: node tests/test_clea_intent_model.cjs
      - run: node tests/test_clea_ai.cjs
      - run: node tests/test_clea_ai_adversarial.cjs
      - run: npm install --prefix /tmp/clea7-qa --no-audit --no-fund playwright@1.56.1
      - name: Verify real Studio, actual calculator events, reset, review, undo, IndexedDB, package and independent Runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/clea7-ai-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tests/test_clea_ai_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CLEA7-local-AI-browser-proof
          path: test-evidence/clea-ai/
          retention-days: 3
