name: Verify staged CLEA Studio agent
on:
  push:
    branches: [fix/clea-live-plan-20261125]
    paths: [.github/workflows/verify-staged-agent.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            studio
            tests/test_staged_studio_agent.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged authoring and real live model
        env:
          CLEA_REAL_MODEL_TEST: '1'
        run: node tests/test_staged_studio_agent.cjs

# Re-run after typed-list correction.
