name: Publish tested CLEA Android APK
on:
  push:
    branches: [main]
    paths: [transfer-public/clea-ai-019.ready]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cat transfer-public/clea-ai-019.part-* | base64 -d > downloads/BL-CLEA-AI-0.1.9-test.apk
          echo 'baa503d9c812b28853f74f0d282b34afdc352a49618f05f7f19485657422c925  downloads/BL-CLEA-AI-0.1.9-test.apk' | sha256sum -c -
          python3 scripts/publish_tested_019.py
          git config user.name "CLEA verified download"
          git config user.email "build@users.noreply.github.com"
          git rm transfer-public/clea-ai-019.part-* transfer-public/clea-ai-019.ready
          git add downloads/BL-CLEA-AI-0.1.9-test.apk clea-ai-android.html release/clea-ai-android-019.json
          git commit -m "Publish exact owner-tested CLEA Android APK"
          git push origin HEAD:main
