name: Promote owner-approved CLEA7 0.15 binaries
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'omer87h-ctrl/blclea7-site.' && github.event.issue.user.login == 'omer87h-ctrl' && github.actor == 'omer87h-ctrl' && github.event.issue.title == 'CLEA7 approved binary promotion 0.15'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: clea7-approved-native-release015
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release boundaries before publication
        run: python -m unittest discover -s tests -p test_binary_transfer015.py -v
      - name: Publish exact approved binaries with the job-scoped public repository token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.promote_approved_binaries015

