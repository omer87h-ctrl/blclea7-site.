name: Verify deployed CLEA7 HTTPS and anonymous downloads
on:
  workflow_dispatch:
  push:
    branches: [work/complete-public-downloads, work/verify-deployed-014]
  workflow_run:
    workflows: ['Verify public BL CLEA7 website and applications']
    branches: [main]
    types: [completed]
permissions:
  contents: read
jobs:
  live-delivery:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual public HTTPS bytes without authentication
        run: python scripts/check_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BL-CLEA7-live-delivery-evidence
          path: test-evidence/live-delivery.json
          retention-days: 14
