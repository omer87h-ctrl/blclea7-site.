name: CLEA AI 7 targeted browser smoke
on:
  pull_request:
    paths:
      - 'studio/clea-ai-lab.html'
      - 'studio/clea-ai-lab.js'
      - 'studio/clea-ai-lab.css'
      - 'tests/test_clea_lab_browser.cjs'
      - '.github/workflows/verify-clea-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/clea7-qa --no-audit --no-fund playwright@1.56.1
      - name: Real Chrome lab-to-Studio and Runtime test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/clea7-lab-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          CLEA7_CHROME="$(command -v google-chrome)" node tests/test_clea_lab_browser.cjs
