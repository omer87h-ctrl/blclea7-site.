name: Verify public BL CLEA7 website and applications
on:
  push:
    branches: [main, work/complete-public-downloads, work/bil-public-0-6, work/studio-applications-07, work/verified-web-backend-09, release/verified-downloads-09, work/native-media-013, work/managed-release-014]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_public_bil_apps.cjs
      - name: Independently execute curated public SDK
        working-directory: sdk-source
        run: |
          python -m clea7 validate sdk/examples/units.application.json
          python -m clea7 test-suite sdk/examples/units.application.json sdk/examples/units.tests.json --mode light
          python -m clea7 test sdk/examples/workflow.application.json --flow finish
          python -m clea7 bil check sdk/examples/bil/core.bil
          python -m clea7 bil run sdk/examples/bil/core.bil
      - run: npm install --prefix /tmp/clea7-public-qa --no-audit --no-fund playwright@1.56.1
      - name: Actual Chrome website and create-package-install-persist acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clea7-qa test-evidence
          ln -s /tmp/clea7-public-qa/node_modules /tmp/clea7-qa/node_modules
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/clea7-public-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          export CLEA7_CHROME="$(command -v google-chrome)"
          node tests/test_public_site.cjs
          node tests/test_public_acceptance.cjs
          node tests/test_public_bil_studio.cjs
          node tests/test_public_bil_apps_ui.cjs
          node tests/test_public_native_studio.cjs
          node tests/test_public_native_install.cjs
          cp downloads/BLclea7-Studio-pregled.html /tmp/BL-CLEA7-Studio-pregled-v2.html
          node tests/test_public_offline.cjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: BL-CLEA7-public-browser-evidence
          path: test-evidence/
          retention-days: 3

  backend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-clea7-runtime
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      CLEA7_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix /tmp/clea7-firebase --no-audit --no-fund firebase-tools@14.18.0
      - run: npm install --prefix /tmp/clea7-qa --no-audit --no-fund playwright@1.56.1
      - name: Verify the public Studio and Runtime against real isolated test services
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/clea7-public-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          /tmp/clea7-firebase/node_modules/.bin/firebase emulators:exec --config tests/firebase/firebase.json --project demo-clea7-runtime --only auth,firestore 'node tests/test_public_remote_studio.cjs'
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: BL-CLEA7-public-backend-evidence
          path: test-evidence/
          retention-days: 3
