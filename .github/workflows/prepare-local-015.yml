name: Prepare curated 0.15 local downloads for owner review
on:
  push:
    branches: [work/prepare-local-downloads-015]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/prepare-local-downloads-015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/prepare_local015.py
      - run: npm install --prefix /tmp/clea7-qa --no-audit --no-fund playwright@1.56.1
      - run: node tests/test_prepared_offline015.cjs
        env:
          CLEA7_CHROME: /usr/bin/google-chrome
      - name: Preserve generated review files without merging or publishing
        run: |
          git config user.name 'Brzo i Lokalno build'
          git config user.email 'build@users.noreply.github.com'
          git add downloads/BL-CLEA7-SDK-0.15.0.zip downloads/BLclea7-Studio-pregled-0.15.html release/prepared-local-015.json downloads/primjer-orbitavo.clea7
          git commit -m 'build: record verified curated SDK and offline Studio 0.15 downloads'
          git push origin HEAD:work/prepare-local-downloads-015

