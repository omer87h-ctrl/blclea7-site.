name: Verify mobile AI application preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-agent-preview.yml, tests/test_public_agent_preview.cjs]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/clea7-qa --no-audit --no-fund playwright@1.56.1
      - name: Test the actual browser and isolated Runtime with fixture responses
        run: |
          python3 -m http.server 4173 >/tmp/clea-agent-preview.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/studio/workbench/ >/dev/null && break; sleep 1; done
          node tests/test_public_agent_preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-agent-preview-evidence
          path: test-evidence/agent-preview/
          if-no-files-found: ignore
