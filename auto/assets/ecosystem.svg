<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" fill="none">
  <title>CLEA Runtime connects five professional tools</title>
  <desc>Original isometric illustration of a shared runtime hub linked to vehicle diagnostics, electrical work, construction, climate systems and workshop tools.</desc>
  <defs>
    <radialGradient id="atmosphere"><stop stop-color="#1B4161" stop-opacity=".55"/><stop offset="1" stop-color="#081326" stop-opacity="0"/></radialGradient>
    <radialGradient id="goldAura"><stop stop-color="#D7B579" stop-opacity=".2"/><stop offset="1" stop-color="#D7B579" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueAura"><stop stop-color="#79D3DF" stop-opacity=".2"/><stop offset="1" stop-color="#79D3DF" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9E5AD"/><stop offset=".46" stop-color="#CBA666"/><stop offset="1" stop-color="#8D6A36"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9CAEBB"/><stop offset=".45" stop-color="#547186"/><stop offset="1" stop-color="#203B54"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ED6D8" stop-opacity=".6"/><stop offset="1" stop-color="#153D5C" stop-opacity=".3"/></linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#203C55"/><stop offset="1" stop-color="#091727"/></linearGradient>
    <linearGradient id="central" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52718B"/><stop offset=".4" stop-color="#152F4A"/><stop offset="1" stop-color="#091827"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173654"/><stop offset="1" stop-color="#091729"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C1F4E9"/><stop offset=".5" stop-color="#6EC4CE"/><stop offset="1" stop-color="#30688A"/></linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#010810" flood-opacity=".65"/></filter>
    <pattern id="grid" width="72" height="42" patternUnits="userSpaceOnUse"><path d="m0 21 36-21 36 21-36 21Zm0 0h72" stroke="#3A6A84" stroke-width=".6" opacity=".17"/></pattern>
    <g id="pod">
      <ellipse cy="15" rx="83" ry="34" fill="#010A18" opacity=".6"/>
      <path d="M-77-4v15c0 37 154 37 154 0V-4" fill="url(#platform)" stroke="#3A5C70" stroke-width=".8"/>
      <ellipse cy="-4" rx="77" ry="28" fill="#122B40" stroke="#517586" stroke-width=".9"/>
      <ellipse cy="-4" rx="67" ry="23" fill="#102338" stroke="#CDB378" stroke-opacity=".65"/>
      <path d="M-66 11c28 16 99 16 132 0" stroke="#6FCBD2" stroke-opacity=".5"/>
      <ellipse cy="-4" rx="57" ry="19" fill="url(#goldAura)"/>
    </g>
    <g id="point"><circle r="7" fill="#F5DFA3" opacity=".18" filter="url(#softGlow)"/><circle r="2" fill="#F5DFA3"/></g>
    <g id="connection"><circle r="4" fill="#102B40" stroke="#92C3CF" stroke-width="1.4"/><circle r="1.3" fill="#D8F0EA"/></g>
  </defs>

  <ellipse cx="400" cy="324" rx="390" ry="294" fill="url(#atmosphere)"/>
  <ellipse cx="400" cy="335" rx="340" ry="260" fill="url(#grid)"/>
  <ellipse cx="400" cy="350" rx="304" ry="174" stroke="#31506C" stroke-opacity=".4"/>
  <ellipse cx="400" cy="350" rx="255" ry="145" stroke="#3F657C" stroke-opacity=".35" stroke-dasharray="3 10"/>
  <ellipse cx="400" cy="350" rx="192" ry="110" stroke="#4E7A91" stroke-opacity=".2"/>

  <!-- The shared context globe is structural illustration, not simulated telemetry. -->
  <g stroke="#5A8CA5" stroke-width=".8" opacity=".4">
    <circle cx="400" cy="235" r="126" fill="#102A49" fill-opacity=".25"/>
    <ellipse cx="400" cy="235" rx="66" ry="126"/>
    <ellipse cx="400" cy="235" rx="106" ry="126"/>
    <ellipse cx="400" cy="235" rx="126" ry="40"/>
    <ellipse cx="400" cy="235" rx="118" ry="83"/>
    <path d="M274 235h252M400 109v252"/>
  </g>
  <path d="m309 166 18-15 17 1 12-12 20 5 1 17-11 7 3 16-16 10-5 19-17 8-12-11 3-20-10-13Zm73 45 15-15 23 3 9 17 17 2 10 13-7 15-18 1-4 24-15 13-5 30-14-4-5-27-12-18 5-22-8-11Zm58-56 27 1 20 19 18 9-2 15-17 6-6-12-17 3-11-18-14 3-5-10Z" fill="#5986A0" opacity=".18"/>
  <g opacity=".8"><use href="#point" x="317" y="141"/><use href="#point" x="478" y="135"/><use href="#point" x="513" y="189"/><use href="#point" x="277" y="215"/></g>

  <!-- All tools meet the same explicit runtime boundary. -->
  <g stroke-linecap="round">
    <path d="M342 299 220 229M459 298l121-70M462 353l110 74M338 353l-110 74M400 375v122" stroke="#D2B577" stroke-opacity=".15" stroke-width="9" filter="url(#softGlow)"/>
    <path d="M342 299 220 229M459 298l121-70M462 353l110 74M338 353l-110 74M400 375v122" stroke="#CCB17B" stroke-width="1.2"/>
    <path d="M334 308 213 238M466 307l121-70M470 345l110 74M330 345l-110 74M409 377v118" stroke="#4F8AA0" stroke-width=".7" stroke-dasharray="2 6"/>
  </g>
  <use href="#point" x="280" y="263"/><use href="#point" x="520" y="263"/>
  <use href="#point" x="523" y="394"/><use href="#point" x="278" y="394"/><use href="#point" x="400" y="445"/>

  <!-- AUTO: original low-poly diagnostic vehicle and evidence probe. -->
  <g transform="translate(162 207)" filter="url(#shadow)">
    <ellipse cy="7" rx="104" ry="49" fill="url(#goldAura)"/>
    <use href="#pod"/>
    <path d="m-46-31 31-17 53 20-31 18Z" fill="#12354D" stroke="#82B9CA" stroke-width=".7"/>
    <path d="m-46-31 53 21v16l-53-20Z" fill="#244D66"/>
    <path d="m7-10 31-18V-13L7 6Z" fill="#122A40"/>
    <path d="m-33-39 8-23 27-13 24 10 5 34-24 14Z" fill="url(#steel)" stroke="#8DB3C5" stroke-width=".7"/>
    <path d="m-22-61 24-10 17 7-22 12Z" fill="url(#glass)"/>
    <path d="m-28-39 8-19 16 8-1 18Z" fill="#162A3D" stroke="#6A9AAE" stroke-width=".6"/>
    <path d="m1-49 19-10 4 24L0-23Z" fill="url(#glass)" stroke="#76ACBB" stroke-width=".7"/>
    <path d="m-41-25 16 6m33 11 20-12" stroke="#F1DA9E" stroke-width="3"/>
    <ellipse cx="-31" cy="-6" rx="7" ry="11" fill="#071421" transform="rotate(-20 -31 -6)"/><ellipse cx="-31" cy="-6" rx="3" ry="6" fill="#68899C" transform="rotate(-20 -31 -6)"/>
    <ellipse cx="20" cy="-1" rx="7" ry="11" fill="#071421" transform="rotate(22 20 -1)"/><ellipse cx="20" cy="-1" rx="3" ry="6" fill="#68899C" transform="rotate(22 20 -1)"/>
    <path d="M35-17h12v-28" stroke="#D8BA79" stroke-width="1.5"/>
    <path d="m37-61 20 6v22l-20-6Z" fill="#173449" stroke="#C8B27F" stroke-width="1"/>
    <path d="m41-54 12 4m-12 4 3 1 2-4 3 8 4-2" stroke="#92E0D5" stroke-width="1.2"/>
    <use href="#connection" x="62" y="13"/>
  </g>

  <!-- ELECTRIC: isolated circuit, visibly routed conductors and meter. -->
  <g transform="translate(638 207)" filter="url(#shadow)">
    <ellipse cy="7" rx="104" ry="49" fill="url(#goldAura)"/>
    <use href="#pod"/>
    <path d="m-36-25 34-19 40 16L4-8Z" fill="#3B5B70" stroke="#94ADBD" stroke-width=".8"/>
    <path d="m-36-25 40 17V7l-40-16Z" fill="#172F44"/><path d="M4-8 38-28v15L4 7Z" fill="#264A60"/>
    <path d="m-27-67 36-20 29 12v47L2-8l-29-12Z" fill="url(#steel)" stroke="#AEC5D0" stroke-width=".7"/>
    <path d="m-20-61 22-12v37l-22 12Z" fill="#0A1C2E" stroke="#547F94" stroke-width=".6"/>
    <path d="m-15-54 12-7m-12 15 12-7m-12 15 12-7" stroke="#D2B477" stroke-width="3"/>
    <path d="m7-72 23 8v30L7-43Z" fill="#36536A"/><path d="m13-65 11 4m-11 5 11 4m-11 5 11 4" stroke="#7996A7" stroke-width="2.5"/>
    <path d="M-12-18v12l-27-10v-13m47 13v12l31-18v-14" stroke="#B7945A" stroke-width="1.5"/>
    <path d="m-50-46 22 8v29l-22-8Z" fill="#B09259" stroke="#F2D69D" stroke-width=".7"/>
    <path d="m-46-40 14 5v10l-14-5Z" fill="#102A3F"/><circle cx="-39" cy="-20" r="3.5" fill="#294457" stroke="#F1DDA9"/>
    <use href="#connection" x="-62" y="13"/>
  </g>

  <!-- Central independent runtime: seven checkpoints, one shared execution core. -->
  <g transform="translate(400 330)" filter="url(#shadow)">
    <ellipse cy="18" rx="138" ry="61" fill="url(#blueAura)"/>
    <path d="M-114-3v21c0 57 228 57 228 0V-3" fill="url(#central)" stroke="#3F6B86"/>
    <ellipse cy="-3" rx="114" ry="44" fill="#183550" stroke="#97B7C8" stroke-width=".8"/>
    <ellipse cy="-3" rx="105" ry="38" fill="#18314C" stroke="#D8BB7D" stroke-width="1.5"/>
    <ellipse cy="-3" rx="96" ry="32" stroke="#79A7B8" stroke-opacity=".5"/>
    <path d="M-106 19c49 25 163 25 212 0" stroke="#D6BA7E" stroke-width="1.1"/>
    <path d="M-102 27c46 23 158 23 204 0" stroke="#78ACBA" stroke-opacity=".5"/>
    <path d="m-64-18 82-23 56 25-84 27Z" fill="#4A6C82" stroke="#88AFBE" stroke-width=".7"/>
    <path d="m-64-18 54 29 84-27v5L-9 17l-55-29Z" fill="#19344A"/>
    <path d="m-67-103 125 14 0 80-125-14Z" fill="#081523" stroke="#8CA9B8" stroke-width="1.5"/>
    <path d="m-61-96 113 13v66L-61-30Z" fill="url(#screen)" stroke="#3D647B" stroke-width=".7"/>
    <path d="m-56-89 102 12" stroke="#7293A8" stroke-opacity=".7"/>
    <circle cx="-53" cy="-92" r="1.2" fill="#DABB7E"/><circle cx="-48" cy="-91.4" r="1.2" fill="#6AB9C4"/>
    <path d="m-50-80 29 3v37l-29-3Z" fill="#26435A"/>
    <path d="m-45-73 18 2m-18 5 13 1.5m-13 5 16 1.8m-16 5 12 1.5" stroke="#82A9BC" stroke-width="1.6"/>
    <path d="m-9-67 10 2 9-13 10 28 13-14 11 1" stroke="#9ED9CD" stroke-width="1.6"/>
    <path d="m-7-40 47 5" stroke="#5E879D" stroke-width="1"/>
    <path d="m-7-46 0 6m8-11v12m8-16v16m8-9v10m8-19v20m8-15v16" stroke="#CFB579" stroke-width="3"/>
    <circle cx="-4" cy="-12" r="2.2" fill="#DABB7E"/>
    <g fill="#DCC493" stroke="#A7CED3" stroke-width=".6"><circle cx="-96" cy="-10" r="3"/><circle cx="-65" cy="-32" r="3"/><circle cx="-13" cy="-40" r="3"/><circle cx="48" cy="-35" r="3"/><circle cx="94" cy="-16" r="3"/><circle cx="70" cy="19" r="3"/><circle cx="-68" cy="19" r="3"/></g>
    <text x="0" y="27" text-anchor="middle" fill="#F2DEAC" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="3">CLEA RUNTIME</text>
  </g>

  <!-- BUILD: distinct levels, structural plan and a measured site. -->
  <g transform="translate(638 449)" filter="url(#shadow)">
    <ellipse cy="7" rx="104" ry="49" fill="url(#blueAura)"/>
    <use href="#pod"/>
    <path d="m-49-19 51-28 47 21L-3 3Z" fill="#29465C" stroke="#6E99AD" stroke-width=".7"/>
    <path d="m-34-63 31-18 28 12-31 18Z" fill="#9BAEBA"/><path d="m-34-63 28 12v47l-28-12Z" fill="#35546B"/><path d="m-6-51 31-18v47L-6-4Z" fill="#56798E"/>
    <path d="m-25-58 11 5v10l-11-5Zm0 17 11 5v10l-11-5ZM2-49l8-4v10l-8 5Zm13-7 6-4v10l-6 4ZM2-32l8-4v10l-8 5Zm13-7 6-4v10l-6 4Z" fill="#E2C58B"/>
    <path d="m20-43 20-11 16 7-20 12Z" fill="#7895A8"/><path d="m20-43 16 8v30L20-12Z" fill="#27465F"/><path d="m36-35 20-12v30L36-5Z" fill="#426981"/>
    <path d="m25-35 6 3v8l-6-3Zm0 13 6 3v8l-6-3ZM41-32l9-5v8l-9 5Zm0 13 9-5v8l-9 5Z" fill="#D8C390"/>
    <path d="M-48-30v30m0-30 15-8m-15 30 15-8M-44-29v15m-7 3 6 3" stroke="#C8AE76" stroke-width="1.2"/>
    <path d="m-20 4 20 8 19-11" stroke="#87B9C8" stroke-width="1.2" stroke-dasharray="2 3"/>
    <use href="#connection" x="-62" y="-20"/>
  </g>

  <!-- CLIMATE: original service unit with fan, closed water loop and fins. -->
  <g transform="translate(162 449)" filter="url(#shadow)">
    <ellipse cy="7" rx="104" ry="49" fill="url(#blueAura)"/>
    <use href="#pod"/>
    <path d="m-43-57 38-22 53 23-39 22Z" fill="#7693A5" stroke="#A0B8C4" stroke-width=".7"/>
    <path d="m-43-57 52 23V8l-52-23Z" fill="#36566E" stroke="#6D94A8" stroke-width=".7"/>
    <path d="M9-34 48-56v42L9 8Z" fill="#1D3C53" stroke="#6D94A8" stroke-width=".7"/>
    <ellipse cx="-17" cy="-27" rx="18" ry="21" transform="rotate(-21 -17 -27)" fill="#112B40" stroke="#8DB4C0"/>
    <path d="M-17-27c-18-9-15-24-4-17 8 5 7 14 4 17Zm0 0c16-10 26 1 14 8-8 4-15-2-14-8Zm0 0c0 18-14 20-14 7 0-8 8-13 14-7Z" fill="#6D9DAF"/>
    <circle cx="-17" cy="-27" r="3.5" fill="#DCC58E"/>
    <path d="m17-30 23-13m-23 20 23-13m-23 20 23-13m-23 20 23-13" stroke="#688DA1" stroke-width="1.6"/>
    <path d="M38-6v11L21 15m7-20v9L12 12" stroke="#C6AE77" stroke-width="3"/>
    <path d="M-43-10v10l-12 6m8-9v10l-8 4" stroke="#75BCC7" stroke-width="2"/>
    <path d="M-51-62c0-5 5-11 5-11s5 6 5 11a5 5 0 0 1-10 0Z" fill="url(#cyan)"/>
    <use href="#connection" x="62" y="-20"/>
  </g>

  <!-- WORKSHOP: original workbench, measured timber and hand-tool system. -->
  <g transform="translate(400 536)" filter="url(#shadow)">
    <ellipse cy="7" rx="104" ry="49" fill="url(#goldAura)"/>
    <use href="#pod"/>
    <path d="m-47-35 46-25 50 21L2-12Z" fill="#A18A5E" stroke="#D6BD86" stroke-width=".9"/>
    <path d="m-47-35 49 23v7l-49-22Z" fill="#715A38"/><path d="M2-12 49-39v7L2-5Z" fill="#8B744A"/>
    <path d="M-40-25v34m35-15v31m46-49V9m-46 8 46-25m-81 3 35 16" stroke="#618195" stroke-width="5"/>
    <path d="m-30-39 40-22 8 4-39 22Z" fill="#E3CAA0" stroke="#F4DDB6" stroke-width=".7"/>
    <path d="m-22-37 38-20m-35 22 38-20" stroke="#9B7947" stroke-width=".6"/>
    <path d="m-4-32 22-12 17 7-22 13Z" fill="#213E51" stroke="#7EABB8" stroke-width=".7"/>
    <path d="m14-44 12-20 7 3-12 20Z" fill="url(#steel)" stroke="#9DBBC6" stroke-width=".7"/>
    <path d="m24-65 8-5 14 7-8 5Z" fill="url(#gold)"/>
    <path d="m-38-38 8-5 13 6-8 5Z" fill="#59788A"/><path d="m-25-32 3-5 11 5-3 5Z" fill="#B89B65"/>
    <path d="m-18-19 14 7 9-5" stroke="#DBCC9D" stroke-width="1.3" stroke-dasharray="1 2"/>
    <use href="#connection" x="0" y="-61"/>
  </g>

  <!-- Clear labels rather than invented live statistics. -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="162" y="270" fill="#E5D3AA" font-size="10" letter-spacing="2.1">DIAGNOSTICS AUTO</text>
    <text x="638" y="270" fill="#E5D3AA" font-size="10" letter-spacing="2.1">ELECTRIC</text>
    <text x="162" y="511" fill="#A8CDD5" font-size="10" letter-spacing="2.1">CLIMATE</text>
    <text x="638" y="511" fill="#A8CDD5" font-size="10" letter-spacing="2.1">BUILD</text>
    <text x="400" y="599" fill="#E5D3AA" font-size="10" letter-spacing="2.1">WORKSHOP</text>
  </g>
  <g opacity=".7"><use href="#point" x="84" y="337"/><use href="#point" x="718" y="337"/><use href="#point" x="282" y="550"/><use href="#point" x="520" y="550"/></g>
</svg>
