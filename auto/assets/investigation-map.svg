    <linearGradient id="map-device" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47677F"/><stop offset=".5" stop-color="#28465E"/><stop offset="1" stop-color="#10283F"/></linearGradient>
    <linearGradient id="map-paper" x1="495" y1="342" x2="591" y2="454" gradientUnits="userSpaceOnUse"><stop stop-color="#34546E"/><stop offset="1" stop-color="#18344D"/></linearGradient>
    <filter id="map-shadow" x="-45%" y="-45%" width="190%" height="210%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020A17" flood-opacity=".65"/></filter>
    <filter id="map-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
