    <g id="map-node"><circle r="6" fill="#1C3B55" stroke="#A0C5D3" stroke-width="1.1"/><circle r="2.1" fill="#C2E0E4"/></g>
    <g id="map-small-node"><circle r="3.5" fill="#10283F" stroke="#92B7CA"/><circle r="1" fill="#B8D9E0"/></g>
  </defs>

