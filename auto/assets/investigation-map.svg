<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" fill="none" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">CLEA7 — od izvora do obrazloženog nalaza</title>
  <desc id="map-desc">Izvorna prostorna shema rada. Instrumenti predaju izvore zajedničkoj jezgri CLEA7. Povezani dokazi vode prema provjerama objašnjenja i dokumentiranom nalazu. Ilustracija prikazuje postupak, bez stvarnih mjerenja ili rezultata.</desc>
  <defs>
    <radialGradient id="map-ambient"><stop stop-color="#28496C" stop-opacity=".5"/><stop offset="1" stop-color="#0B1628" stop-opacity="0"/></radialGradient>
    <radialGradient id="map-gold-halo"><stop stop-color="#D8B66F" stop-opacity=".19"/><stop offset="1" stop-color="#D8B66F" stop-opacity="0"/></radialGradient>
    <linearGradient id="map-face" x1="235" y1="260" x2="398" y2="434" gradientUnits="userSpaceOnUse"><stop stop-color="#29465F"/><stop offset="1" stop-color="#0B1C30"/></linearGradient>
    <linearGradient id="map-top" x1="223" y1="288" x2="421" y2="358" gradientUnits="userSpaceOnUse"><stop stop-color="#304F69"/><stop offset=".55" stop-color="#1A354F"/><stop offset="1" stop-color="#152C44"/></linearGradient>
    <linearGradient id="map-gold" x1="215" y1="280" x2="461" y2="382" gradientUnits="userSpaceOnUse"><stop stop-color="#F0D69D"/><stop offset=".45" stop-color="#D3B477"/><stop offset="1" stop-color="#9D7E49"/></linearGradient>
